<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Election Analytics{% endblock %} — Portugal Autárquicas 2021</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
  <style>
    body { background: #f1f3f5; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    #map { height: 82vh; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .stat-value { font-size: 1.4rem; font-weight: 700; }
    .table th { font-size: .8rem; text-transform: uppercase; color: #6c757d; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3 py-2">
  <a class="navbar-brand" href="/">Portugal Elections</a>
  <span class="text-secondary small">Advanced Topics in Databases · Autárquicas 2021</span>
</nav>
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
